<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الأسئلة الشامل (50 سؤالاً) | الوحدة الأولى - تكنولوجيا المعلومات والاتصالات</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0d9488;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --purple: #8b5cf6;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.8;
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #2563eb 100%);
            color: white;
            padding: 40px 20px 30px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(37, 99, 235, 0.2);
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1.1rem;
            color: #cbd5e1;
            max-width: 800px;
            margin: 0 auto 15px;
        }

        .badges-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .controls-sticky {
            position: sticky;
            top: 15px;
            z-index: 1000;
            max-width: 1200px;
            margin: -25px auto 25px;
            padding: 0 20px;
        }

        .dashboard-glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            padding: 12px 20px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            max-width: 100%;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .score-counter {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1rem;
            font-weight: 800;
        }

        .score-pill {
            background: #eff6ff;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid #bfdbfe;
        }

        .reset-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #fecaca;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 22px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.25s ease;
        }

        .q-card:hover {
            border-color: #cbd5e1;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.06);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 10px;
        }

        .q-tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .tag-book { background: #dbeafe; color: #1e40af; }
        .tag-extra { background: #fef3c7; color: #92400e; }
        .tag-tf { background: #f3e8ff; color: #6b21a8; }
        .tag-match { background: #d1fae5; color: #065f46; }

        .q-title {
            font-size: 1.12rem;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .opt-btn {
            background: #f8fafc;
            border: 1px solid var(--border);
            padding: 13px 18px;
            border-radius: 12px;
            text-align: right;
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .opt-btn:hover:not(:disabled) {
            background: #eff6ff;
            border-color: var(--primary);
            transform: translateX(-3px);
        }

        .opt-btn.correct {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            font-weight: 800;
        }

        .opt-btn.wrong {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }

        .tf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .tf-btn {
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--border);
            background: white;
            transition: all 0.2s;
        }

        .tf-btn.true:hover:not(:disabled) { background: #ecfdf5; border-color: var(--success); color: var(--success); }
        .tf-btn.false:hover:not(:disabled) { background: #fef2f2; border-color: var(--danger); color: var(--danger); }

        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 0.95rem;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #14532d;
            animation: fadeIn 0.3s ease;
        }

        .explanation-box.wrong-alert {
            background: #fff5f5;
            border-color: #fecaca;
            color: #991b1b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>بنك الأسئلة التفاعلي الشامل (50 سؤالاً)</h1>
        <p>الوحدة الأولى: دراسة المعلومات والوسائط والأخلاقيات | الصف الأول الثانوي (2025 - 2026)</p>
        <div class="badges-bar">
            <span class="badge">جميع أسئلة كتاب الوزارة كاملة</span>
            <span class="badge">أسئلة تفوق وتميز إضافية</span>
            <span class="badge">تصحيح وشرح فوري لكل سؤال</span>
        </div>
    </header>

    <div class="controls-sticky">
        <div class="dashboard-glass">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterQuestions('all', this)">جميع الأسئلة (<span id="countAll">50</span>)</button>
                <button class="filter-btn" onclick="filterQuestions('book-mcq', this)">اختر من متعدد (<span id="countMcq">0</span>)</button>
                <button class="filter-btn" onclick="filterQuestions('book-tf', this)">صح وخطأ (<span id="countTf">0</span>)</button>
                <button class="filter-btn" onclick="filterQuestions('book-match', this)">تصنيف ومفاهيم (<span id="countMatch">0</span>)</button>
                <button class="filter-btn" onclick="filterQuestions('extra', this)">أسئلة التفوق (<span id="countExtra">0</span>)</button>
            </div>
            <div class="score-counter">
                <div class="score-pill" id="scoreDisplay">النتيجة: 0 / 0</div>
                <button class="reset-btn" onclick="resetAll()">🔄 إعادة الاختبار</button>
            </div>
        </div>
    </div>

    <main class="container" id="quizContainer">
        <!-- الأسئلة تتولد هنا ديناميكياً -->
    </main>

        let userAnswers = {};
        let currentFilter = 'all';

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = "";

            const filtered = allQuestions.filter(q => {
                if (currentFilter === 'all') return true;
                return q.category === currentFilter;
            });

            filtered.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = 'q-card';
                card.id = `qCard_${q.id}`;

                let tagClass = 'tag-book';
                let tagText = 'كتاب الوزارة';
                if (q.category === 'extra') { tagClass = 'tag-extra'; tagText = 'سؤال تفوق إضافي'; }
                else if (q.category === 'book-tf') { tagClass = 'tag-tf'; tagText = 'صح أم خطأ'; }
                else if (q.category === 'book-match') { tagClass = 'tag-match'; tagText = 'تصنيف ومطابقة'; }

                let optionsHtml = '';
                if (q.category === 'book-tf') {
                    optionsHtml = `
                        <div class="tf-grid" id="optGroup_${q.id}">
                            <button class="tf-btn true" onclick="handleSelect(${q.id}, 0, this)">✅ صـــح</button>
                            <button class="tf-btn false" onclick="handleSelect(${q.id}, 1, this)">❌ خـطـأ</button>
                        </div>
                    `;
                } else {
                    optionsHtml = `
                        <div class="options-grid" id="optGroup_${q.id}">
                            ${q.choices.map((c, cIdx) => `
                                <button class="opt-btn" onclick="handleSelect(${q.id},${cIdx}, this)">
                                    <span>${c}</span>
                                </button>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-tag ${tagClass}">سؤال رقم (${q.id}) - ${tagText}</span>
                        <small style="color:var(--text-muted); font-size:0.85rem;">${q.source}</small>
                    </div>
                    <div class="q-title">${q.q}</div>
                    ${optionsHtml}
                    <div class="explanation-box" id="exp_${q.id}">
                        <strong>📖 التفسير المنهجي النموذجي:</strong> ${q.explanation}
                    </div>
                `;

                container.appendChild(card);
            });

            updateCounts();
        }

        function handleSelect(qId, selectedIdx, btn) {
            const question = allQuestions.find(item => item.id === qId);
            const group = document.getElementById(`optGroup_${qId}`);
            const buttons = group.querySelectorAll('button');
            const expBox = document.getElementById(`exp_${qId}`);

            buttons.forEach(b => b.disabled = true);

            userAnswers[qId] = selectedIdx;

            if (selectedIdx === question.correct) {
                btn.classList.add('correct');
                expBox.classList.remove('wrong-alert');
            } else {
                btn.classList.add('wrong');
                buttons[question.correct].classList.add('correct');
                expBox.classList.add('wrong-alert');
            }

            expBox.style.display = 'block';
            updateScore();
        }

        function updateScore() {
            let correctCount = 0;
            const answeredIds = Object.keys(userAnswers);

            answeredIds.forEach(id => {
                const q = allQuestions.find(item => item.id == id);
                if (q && userAnswers[id] === q.correct) {
                    correctCount++;
                }
            });

            document.getElementById('scoreDisplay').innerText = `النتيجة: ${correctCount} / ${answeredIds.length}`;
        }

        function updateCounts() {
            document.getElementById('countAll').innerText = allQuestions.length;
            document.getElementById('countMcq').innerText = allQuestions.filter(q => q.category === 'book-mcq').length;
            document.getElementById('countTf').innerText = allQuestions.filter(q => q.category === 'book-tf').length;
            document.getElementById('countMatch').innerText = allQuestions.filter(q => q.category === 'book-match').length;
            document.getElementById('countExtra').innerText = allQuestions.filter(q => q.category === 'extra').length;
        }

        function filterQuestions(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderQuestions();
        }

        function resetAll() {
            userAnswers = {};
            document.getElementById('scoreDisplay').innerText = `النتيجة: 0 / 0`;
            renderQuestions();
        }

        // تشغيل البنك التفاعلي
        renderQuestions();
    </script>
